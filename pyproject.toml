[project]
name = "caniuseonlywheels"
version = "1.0.11"
description = "Can I switch to installing only using wheels and never sdist?"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.7,<4.0"
authors = [{ name = "Matthew Martin", email = "matthewdeanmartin@gmail.com" }]
keywords = ["supply-chain", "wheels"]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "packaging>=20.9",
    "setuptools>=60",
    "requests>=2.23.0",
    "certifi>=2020.6.20",
]

[project.urls]
Homepage = "https://matthewdeanmartin.github.io/caniuseonlywheels/"
Documentation = "https://caniuseonlywheels.readthedocs.io/en/latest/"
Repository = "https://github.com/matthewdeanmartin/caniuseonlywheels"
"Bug Tracker" = "https://github.com/matthewdeanmartin/caniuseonlywheels/issues"
"Change Log" = "https://github.com/matthewdeanmartin/caniuseonlywheels/blob/main/CHANGELOG.md"

[project.scripts]
caniuseonlywheels = "caniuseonlywheels.__main__:main"

[tool.black]
line-length = 88
target-version = ['py37']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["caniuseonlywheels*"]

[tool.setuptools.package-data]
caniuseonlywheels = ["*.json", "*.txt"]
"caniuseonlywheels.distlib" = ["*.exe"]
"caniuseonlywheels.distlib._backport" = ["*.cfg"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
junit_family = "xunit1"
norecursedirs = ["vendor", "scripts"]
# don't know how to do this in toml
#addopts = "--strict-markers"
#markers =
#	slow: marks tests as slow (deselect with '-m "not slow"')
#	fast: marks tests as fast (deselect with '-m "not fast"')

[tool.isort]
default_section = "THIRDPARTY"
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = ["pydoc_fork"]
line_length = 88
multi_line_output = 3
use_parentheses = true

[tool.pydoc_fork]
PREFER_INTERNET_DOCUMENTATION = false
DOCUMENT_INTERNALS = false
SKIP_MODULES = ["typing"]
ONLY_NAMED_AND_SUBS = false

[tool.portray]
output_dir = "doc/docs_portray"

[dependency-groups]
dev = [
    "pytest>=7.4.3; python_version >= '3.11'",
    "pytest-cov>=2.10.1; python_version >= '3.11'",
    "flake8>1; python_version >= '3.11'",
    "pylint>=3.0; python_version >= '3.11'",
    "mypy>=1.8; python_version >= '3.11'",
    "check-wheel-contents>=0.6.0; python_version >= '3.11'",
    "black>=24.0; python_version >= '3.11'",
    "isort>=5.13; python_version >= '3.11'",
    "ruff>=0.4; python_version >= '3.11'",
    "vermin; python_version >= '3.11'",
    "distlib; python_version >= '3.11'",
]

[tool.uv]

[tool.uv.pip]
universal = true
