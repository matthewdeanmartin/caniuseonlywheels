name: Build and Test

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install uv
        run: 'python -m pip install --only-binary :all: uv'
      - name: Sync published-wheel dependencies
        run: uv sync --frozen --no-build --python 3.11
      - name: Validate changelog
        run: uv run --frozen --no-build changelogmanager validate --strict
      - name: Test and build wheel
        run: bash ./build.sh
